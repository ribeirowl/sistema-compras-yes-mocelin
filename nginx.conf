# Cache das fichas por status: só o que deu certo pode ficar guardado.
# Sem isso, um 404 temporário era cacheado por 7 dias e o produto continuava
# mostrando "404 Not Found" no painel mesmo depois do arquivo voltar.
map $status $ficha_cache {
    200     "public, max-age=604800";
    206     "public, max-age=604800";
    304     "public, max-age=604800";
    default "no-store";
}

server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # HTML nunca cacheado
    location ~* \.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Vite SPA — serve /app/* from the built dist folder
    location /app/ {
        alias /usr/share/nginx/html/app/;
        try_files $uri $uri/ /app/index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # Fichas técnicas / manuais Intelbras: o nosso servidor busca o PDF na hora (nada fica armazenado).
    # Permite exibir o PDF dentro do sistema (painel lateral) e baixar com nome padronizado.
    # Só repassa PDFs de backend.intelbras.com/sites/default/files/ (não é um proxy aberto).
    location /intelbras-files/ {
        # Só repassa .pdf. O teste usa "return", que é uso seguro de "if" aqui.
        # "!~*" (e não "!~") porque 23 arquivos da Intelbras terminam em ".PDF"
        # maiúsculo; com o teste sensível a caixa eles eram barrados aqui mesmo.
        if ($request_uri !~* "^/intelbras-files/[^?#]+\.pdf(\?|$)") { return 404; }
        # ATENÇÃO: o proxy_pass NÃO pode conter variável. Com variável o nginx
        # re-escapa o caminho e o "%" vira "%25", quebrando os 36% de arquivos
        # cujo nome tem espaço ou acento (ex.: "Datasheet%20CI%201000..pdf").
        # Com a URI fixa, o nginx troca o prefixo e repassa o resto com a
        # codificação original intacta — e resolve o DNS na subida, sem resolver.
        proxy_pass https://backend.intelbras.com/sites/default/files/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_ssl_server_name on;
        proxy_set_header Host backend.intelbras.com;
        proxy_set_header Cookie "";
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Content-Disposition;
        proxy_hide_header Set-Cookie;
        # A Intelbras manda o próprio Cache-Control/Expires; escondemos para não
        # sair cabeçalho duplicado e mandamos o nosso, que depende do status.
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        add_header Content-Disposition "inline" always;
        add_header Cache-Control $ficha_cache always;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # Sem landing page — raiz vai direto para a tela de login do app
    location = / {
        return 302 /app/;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
