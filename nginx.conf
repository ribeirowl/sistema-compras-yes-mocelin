server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # HTML nunca cacheado
    location ~* \.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Vite SPA — serve /app/* from the built dist folder
    location /app/ {
        alias /usr/share/nginx/html/app/;
        try_files $uri $uri/ /app/index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # Fichas técnicas / manuais Intelbras: o nosso servidor busca o PDF na hora (nada fica armazenado).
    # Permite exibir o PDF dentro do sistema (painel lateral) e baixar com nome padronizado.
    # Só repassa PDFs de backend.intelbras.com/sites/default/files/ (não é um proxy aberto).
    location /intelbras-files/ {
        set $ipath "";
        if ($request_uri ~ "^/intelbras-files/([^?#]+\.pdf)") { set $ipath $1; }
        if ($ipath = "") { return 404; }
        resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
        resolver_timeout 5s;
        proxy_pass https://backend.intelbras.com/sites/default/files/$ipath;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_ssl_server_name on;
        proxy_set_header Host backend.intelbras.com;
        proxy_set_header Cookie "";
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Content-Disposition;
        proxy_hide_header Set-Cookie;
        add_header Content-Disposition "inline" always;
        add_header Cache-Control "public, max-age=604800" always;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # Sem landing page — raiz vai direto para a tela de login do app
    location = / {
        return 302 /app/;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
