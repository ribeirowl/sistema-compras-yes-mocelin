name: Manter o sistema acordado

# No plano gratuito do Render a instância hiberna após ~15 min sem acesso, e o
# primeiro vendedor da manhã espera o Docker subir. Este workflow cutuca o site
# para ele não dormir durante o expediente.
#
# POR QUE SÓ NO EXPEDIENTE: o plano gratuito dá 750 horas de instância por MÊS
# somadas em TODA a workspace, e hoje há dois serviços web gratuitos
# (sistema-compras e crm). Manter um acordado 24/7 consome ~730 h sozinho e
# derrubaria os dois no meio do mês. A janela abaixo gasta ~264 h/mês por
# serviço — 528 h para os dois, com folga dentro das 750.
#
# Se mudar a janela, refaça essa conta antes.

on:
  schedule:
    # 10h-21h UTC = 07h-18h em Brasília, de segunda a sexta.
    - cron: '*/10 10-21 * * 1-5'
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: manter-acordado
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    # Cada execução fica viva até o fim do expediente (limite do GitHub: 6 h por job).
    timeout-minutes: 355
    steps:
      - name: Cutucar o site
        env:
          ALVO: https://sistema-compras-yes-mocelin.onrender.com/
          # 22h UTC = 19h em Brasília: depois disso deixa o serviço dormir
          FIM_UTC: '22'
        run: |
          # O agendamento do GitHub atrasa MUITO: o cron de 10 em 10 min rodou só
          # ~3 vezes por dia, e cada execução cutucava 5x em ~8 min — o resto do dia
          # o serviço hibernava e a 1a abertura (ficha técnica, login...) esperava o
          # Docker subir. Agora cada execução segue cutucando a cada 9 min (o Render
          # hiberna com 15 min sem acesso) até o fim do expediente ou do limite do job.
          # Uma execução nova que chegar enquanto esta roda fica na fila (concurrency).
          limite=$(( $(date +%s) + 340*60 ))
          i=0
          while :; do
            i=$((i+1))
            inicio=$(date +%s)
            codigo=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 90 "$ALVO" || echo "erro")
            echo "$(date -u '+%H:%M:%S') UTC  ping $i -> $codigo  ($(( $(date +%s) - inicio ))s)"
            hora=$(date -u +%H); dow=$(date -u +%u)
            if [ "$dow" -gt 5 ] || [ "$((10#$hora))" -ge "$FIM_UTC" ]; then echo "Fim do expediente."; break; fi
            [ $(( $(date +%s) + 540 )) -ge "$limite" ] && { echo "Limite do job."; break; }
            sleep 540
          done
          # Nunca falha o job: um ping perdido não é motivo para e-mail de erro.
          exit 0
